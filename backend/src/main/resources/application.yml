spring:
  application:
    name: caygiaphaso-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skillseed}?currentSchema=caygiaphaso
    username: ${DB_USER:skillseed}
    password: ${DB_PASSWORD:skillseed_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CayGiaphaSoHikariCP

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      indent-output: false
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# JWT configuration
jwt:
  # 256-bit (32-byte) base64-encoded secret. Replace via env JWT_SECRET in production.
  secret: ${JWT_SECRET:Y2F5Z2lhcGhhc28tc2VjcmV0LWtleS1mb3ItZGV2LW9ubHktY2hhbmdlLWluLXByb2Q=}
  expiration: ${JWT_EXPIRATION:604800000}  # 7 days in milliseconds
  issuer: caygiaphaso

# Logging
logging:
  level:
    root: INFO
    com.giapha: DEBUG
    org.springframework.security: INFO
    org.springframework.jdbc.core: INFO
    org.springframework.web: INFO
    org.flywaydb: INFO

# Application metadata
info:
  app:
    name: CâyGiaPhảSố
    version: 0.0.1-SNAPSHOT
    description: Digital Family Tree Platform Backend
